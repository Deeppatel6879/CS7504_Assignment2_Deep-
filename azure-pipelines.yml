# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:

  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '7a974462-b8a9-47dd-a567-96159d6abdf8'
  imageRepository: 'deeppatelcsassignmentdeep'
  containerRegistry: 'acrc7504deep2026.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'acrc7504deep20262ca4-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'


stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:

      - task: Docker@2
        displayName: Build and push an image to container registry
        inputs:
          containerRegistry: '7a974462-b8a9-47dd-a567-96159d6abdf8'
          repository: '$(imageRepository)'
          command: 'buildAndPush'
          Dockerfile: '$(Build.SourcesDirectory)/TutorBookingApp/Dockerfile'
          buildContext: '$(Build.SourcesDirectory)'
          tags: |
            $(tag)


      - script: |
          docker pull $(containerRegistry)/$(imageRepository):$(tag)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 $(containerRegistry)/$(imageRepository):$(tag)
        displayName: 'Trivy container security scan'

      - publish: '$(Build.SourcesDirectory)/manifests'
        artifact: manifests

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'Deeppatel6879CS7504Assignment2Deep.default'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)



